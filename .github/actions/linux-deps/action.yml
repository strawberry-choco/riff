# the ONE Linux apt list. ci.yml and release.yml both call this action instead
# of carrying a copy, so the two cannot drift apart. The two human-readable
# copies (CONTRIBUTING.md and docs/engineering/development-setup.md) are held to
# the same package set by tests/repo_invariant_tests.rs.
#
# eframe 0.35 (wgpu + winit x11/wayland + clipboard) and cpal 0.18 (ALSA) need
# these headers to COMPILE on Linux. The per-package verdict:
#
# - libgtk-3-dev is still intentionally NOT required. tray-icon/muda/rfd stay
#   gated to non-Linux targets, and the Linux folder picker is a text input.
# - libgtk-4-dev IS required from N1, for nsh-platform-linux: the nsh frontend's
#   Linux platform builds against GTK 4.
# - clang's consumer is unverified. nsh-platform-linux's build script is unread,
#   and the first Linux CI run is the measurement, so it is kept until that run
#   says otherwise.
# - the two GStreamer packages are kept as a superset for the same reason: the
#   platform crate is unread, so the list errs on the side of too much.
# - WebKitGTK is deliberately absent: the nsh `webview` feature is off.
# - mesa-vulkan-drivers provides lavapipe, the software Vulkan adapter that
#   egui_kittest's wgpu renderer needs to run the golden-image tests headless.
name: 'linux system dependencies'
description: 'Install the one shared Linux apt list (the egui compile headers plus the nsh platform additions).'
runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y \
          pkg-config \
          libasound2-dev \
          libudev-dev \
          libx11-dev \
          libxcursor-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxi-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libssl-dev \
          mesa-vulkan-drivers \
          libgtk-4-dev \
          clang \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev
