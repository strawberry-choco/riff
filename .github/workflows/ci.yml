name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # eframe 0.34 (wgpu + winit x11/wayland + clipboard) and cpal 0.18 (ALSA)
      # need these headers to COMPILE on Linux. tray-icon/muda/rfd are gated to
      # non-Linux targets, so libgtk-3-dev is intentionally NOT required here.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev

      # Installs pinned stable Rust with rustfmt + clippy, enables cargo caching
      # (Swatinem/rust-cache under the hood) and PR problem-matchers. Successor to
      # the archived actions-rs/toolchain.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      # Respects the repo's [lints.clippy] levels (pedantic = warn). The tree
      # is kept clippy-clean, so any warning fails the build (-D warnings).
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets
