name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

# this workflow only runs `cargo fmt`/`clippy`/`test` and needs no write
# access. Stating the token scope explicitly stops a future tag-triggered
# release workflow from silently inheriting a broader repository default.
permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The Linux leg names its image because the image is part of the verdict:
        # the golden tests rasterise through the runner's Mesa/lavapipe, so an image
        # move can cross a smoke threshold with no code change. `ubuntu-latest`
        # resolves to `ubuntu-24.04` today, which makes this a no-op pin rather than
        # a migration. Windows deliberately stays on `latest`: that alias now covers
        # two Windows Server 2025 flavours differing by Visual Studio toolset, and no
        # public source says which one it carries, so naming a label there would be a
        # toolchain change dressed up as a pin. Settle that first — and keep this leg
        # and `release.yml`'s Windows build leg the same label, or the Windows
        # toolchain CI tests is not the one that ships.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # eframe 0.35 (wgpu + winit x11/wayland + clipboard) and cpal 0.18 (ALSA)
      # need these headers to COMPILE on Linux. tray-icon/muda/rfd are gated to
      # non-Linux targets, so libgtk-3-dev is intentionally NOT required here.
      # mesa-vulkan-drivers provides the lavapipe software Vulkan adapter that
      # egui_kittest's wgpu renderer needs to run golden-image tests headless.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev \
            mesa-vulkan-drivers

      # Installs the pinned Rust toolchain with rustfmt + clippy, enables cargo
      # caching (Swatinem/rust-cache under the hood) and PR problem-matchers.
      # Successor to the archived actions-rs/toolchain.
      #
      # The toolchain is pinned rather than `stable` because this workflow's
      # verdict must be about the change, not about the calendar: `clippy
      # --all-targets -- -D warnings` with the workspace's pedantic lints means a
      # Rust release can redden every branch with no code change (1.99.0 did, via
      # `assert_is_empty`). `msrv` in the manifests is separate — 1.95, and no job
      # enforces it. Bump deliberately: install the new version locally and get a
      # clean `cargo +<new> clippy --locked --all-targets --keep-going -- -D warnings`
      # first, remembering that a platform's `cfg` arms compile only on it.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      # Respects the repo's [lints.clippy] levels (pedantic = warn). The tree
      # is kept clippy-clean, so any warning fails the build (-D warnings).
      #
      # `--locked` pins the dependency graph, which the toolchain pin alone does
      # not: Cargo.lock is committed, so without it an unsatisfiable requirement (an
      # edited manifest, a new transitive version) silently re-resolves into a build
      # nothing else saw — `egui = "0.35"` is the live case, since the goldens are
      # exact for one patch level and a caret range lets any 0.35.x in. With it, a
      # stale lock is a loud failure instead of a different program.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Same lock discipline as Clippy: the tests, and the golden baselines they
      # compare against, must run against the resolved graph the repository carries.
      - name: Test
        run: cargo test --locked --all-targets

  # the pre-merge gate for commit messages. Validates every commit between the
  # merge base and the branch head with the same validator the local hook runs,
  # so a message that passes locally can never fail here and break an
  # otherwise green build. Linux only, so the matrix does not grow.
  commit-lint:
    name: commit messages (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # full history: the merge base against the target branch cannot be
      # computed from the default shallow clone.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # the gate logic itself (self-test, non-empty-range guard, per-commit
      # loop) lives in the composite action shared with the push gate; the job
      # only computes the range the pull request adds.
      - name: Resolve the pull request's commit range
        id: range
        run: echo "range=$(git merge-base "origin/${{ github.base_ref }}" HEAD)..HEAD" >> "$GITHUB_OUTPUT"

      - name: Validate the pull request's commits
        uses: ./.github/actions/commit-lint
        with:
          range: ${{ steps.range.outputs.range }}

  # the defense-in-depth gate for direct pushes to the default branch. The
  # range is exactly the commits that landed — the branch's previous tip up to
  # the new one — so a push that arrives by another route meets the same
  # message rules a pull request does, and the same shared gate logic runs.
  commit-lint-push:
    name: commit messages (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # full history: github.event.before is the branch's previous tip, which
      # a shallow clone of the new tip cannot resolve.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # a push whose previous tip cannot be resolved — the zero SHA, as on a
      # branch created at the new tip, or a SHA the checkout does not contain —
      # cannot name the commits that landed, so it fails loudly rather than
      # passing vacuously.
      - name: Resolve the pushed commit range
        id: range
        run: |
          set -euo pipefail

          zero=0000000000000000000000000000000000000000
          before="${{ github.event.before }}"
          if [ "$before" = "$zero" ] || ! git rev-parse --verify --quiet "${before}^{commit}" >/dev/null 2>&1; then
            echo "::error::github.event.before (${before}) does not resolve to an existing commit; the pushed commit range cannot be resolved, so there is nothing safe to validate"
            exit 1
          fi

          echo "range=${before}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"

      - name: Validate the pushed commits
        uses: ./.github/actions/commit-lint
        with:
          range: ${{ steps.range.outputs.range }}
