name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

# this workflow only runs `cargo fmt`/`clippy`/`test` and needs no write
# access. Stating the token scope explicitly stops a future tag-triggered
# release workflow from silently inheriting a broader repository default.
permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # eframe 0.35 (wgpu + winit x11/wayland + clipboard) and cpal 0.18 (ALSA)
      # need these headers to COMPILE on Linux. tray-icon/muda/rfd are gated to
      # non-Linux targets, so libgtk-3-dev is intentionally NOT required here.
      # mesa-vulkan-drivers provides the lavapipe software Vulkan adapter that
      # egui_kittest's wgpu renderer needs to run golden-image tests headless.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev \
            mesa-vulkan-drivers

      # Installs pinned stable Rust with rustfmt + clippy, enables cargo caching
      # (Swatinem/rust-cache under the hood) and PR problem-matchers. Successor to
      # the archived actions-rs/toolchain.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      # Respects the repo's [lints.clippy] levels (pedantic = warn). The tree
      # is kept clippy-clean, so any warning fails the build (-D warnings).
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  # the pre-merge gate for commit messages. Validates every commit between the
  # merge base and the branch head with the same validator the local hook runs,
  # so a message that passes locally can never fail here and break an
  # otherwise green build. Linux only, so the matrix does not grow.
  commit-lint:
    name: commit messages (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # full history: the merge base against the target branch cannot be
      # computed from the default shallow clone.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # a broken validator must fail loudly here, never pass by crashing into
      # a pass — hence the self-test before any commit is validated.
      - name: Run the validator's self-test
        run: python3 tools/validate-commit-msg.py --self-test

      - name: Validate the pull request's commits
        run: |
          set -euo pipefail

          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          count=$(git rev-list --count "${base}..HEAD")

          # an empty range would validate nothing and pass vacuously — the
          # failure mode the release workflow's version guard is explicitly
          # written to avoid — so it is an explicit error, not a pass.
          if [ "$count" -eq 0 ]; then
            echo "::error::commit range ${base}..HEAD resolved to nothing; there are no commits to validate"
            exit 1
          fi

          # all rules live in the validator; nothing about the message format
          # is re-implemented here.
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          for sha in $(git rev-list --reverse "${base}..HEAD"); do
            git log -1 --format=%B "$sha" > "$tmp"
            if ! reason=$(python3 tools/validate-commit-msg.py "$tmp" 2>&1); then
              echo "::error::commit $(git log -1 --format='%h %s' "$sha") is not a valid commit message: $reason"
              exit 1
            fi
          done
