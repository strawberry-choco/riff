name: Release

# Tag-triggered. Every release starts as `git push origin v<version>`, and the
# tag is the single input: the artifact names and the release title are derived
# from `github.ref_name` below, so no version string is ever written literally
# into this file.
on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

# Workflow default is read-only, matching ci.yml. The one exception is the
# `release` job, which is the ONLY job here granted `contents: write`, and only
# because `gh release create` needs it. Keeping the broader scope off the
# default means the four-way `build` matrix — which compiles a full Cargo
# dependency graph and runs its build scripts — cannot write to this repository
# even if a dependency is compromised.
permissions:
  contents: read

jobs:
  # The tag/version guard lives HERE and not in ci.yml on purpose. ci.yml
  # triggers only on pushes to `master` and on pull requests, so a tag-versus-
  # version check in that workflow would never execute — it would be a guard
  # that always passes because it never runs. This is the only workflow that
  # fires on a tag, so this is the only place the check can do any work.
  verify:
    name: verify tag
    # `needs: []` states that this job depends on nothing. It is the first thing
    # the run does, so a mistyped tag fails in under a minute instead of after
    # four full release builds.
    needs: []
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `cargo metadata` is not needed for the check, but the runner image's
      # cargo version is not something this workflow should quietly depend on:
      # the manifests are edition 2024, which older cargo cannot parse. Pin the
      # same toolchain the build job installs, minus the lint components that
      # only CI needs.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable

      - name: Check the tag against the workspace version
        run: |
          set -euo pipefail
          # Read the version through `cargo metadata`, never by grepping a
          # manifest. The version is single-sourced in `[workspace.package]`
          # and every member says `version.workspace = true`, so no manifest
          # contains a literal `version = "..."` any more: a grep-based guard
          # would find nothing, pass vacuously, and let `v0.9.9` ship.
          workspace_version="$(
            cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"
          tag="${GITHUB_REF_NAME}"
          # Rule: the tag is `v` + the workspace version, optionally followed by
          # a SemVer pre-release and/or build suffix (`vX.Y.Z`, `vX.Y.Z-rc.1`,
          # `vX.Y.Z+20260928`, `vX.Y.Z-rc.1+20260928`, with X.Y.Z being whatever
          # Cargo.toml says). The numeric core must match exactly. Allowing the
          # suffix means a pre-1.0 release candidate can be cut without editing
          # this guard; it is deliberately orthogonal to the GitHub pre-release
          # MARKER, which the `release` job always sets regardless of the tag's
          # shape.
          core="${tag%%+*}"
          core="${core%%-*}"
          if [ "${core}" != "v${workspace_version}" ]; then
            echo "::error::tag ${tag} does not match the workspace version ${workspace_version}"
            echo "Fix the version in the root Cargo.toml [workspace.package] block, or retag as v${workspace_version}."
            exit 1
          fi
          # The core matched, so this only rejects shapes that are not releases
          # at all: `vfoo`, `v1.2`, `v1.2.3.4`, `vX.Y.Z-`, `vX.Y.Z extra`.
          if ! printf '%s' "${tag}" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${tag} is not a release tag (expected v<major>.<minor>.<patch>[-prerelease][+build])"
            exit 1
          fi
          echo "tag ${tag} matches workspace version ${workspace_version}"

  # Generate the release notes' "what changed" section from the commit
  # history — the same git-cliff rendering, over the same tag range and with
  # the same cliff.toml, that produces CHANGELOG.md (see "Cutting a release"
  # in docs/engineering/release-and-packaging.md). Rendering the section here
  # rather than copying the Changelog means the notes and the Changelog can
  # never disagree about what a release contains.
  #
  # This is a separate job from publication on purpose: the build matrix
  # waits on it, so a notes or guard failure stops the run before any
  # platform build starts — the notes can never be half-published, and
  # drift is caught at the cost of a minute rather than four builds.
  notes:
    name: generate release notes
    # `needs: []` states that this job depends on nothing, like `verify`
    # above: it starts in parallel with `verify`, and the build matrix
    # begins only after both of them succeed.
    needs: []
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ONLY checkout at full history in this workflow: rendering the
          # range v0.1.0..<tag> requires the commits between the two, and the
          # default shallow clone contains neither the old tag nor the
          # history behind it. Every other job here can stay shallow, and the
          # publish job never checks the repository out at all.
          fetch-depth: 0

      # Installed as a pinned release binary rather than through the official
      # Action: the generation step below pipes git-cliff's raw stdout
      # straight into the section extractor, and a pinned binary keeps the
      # toolchain version explicit — the same 2.14.x line cliff.toml was
      # verified against. (orhun/git-cliff-action v4.9.1, pinned to
      # a9a95522b26fe6403f7bb24031f21fb573d0f5ff, is the like-for-like
      # Action substitute if this ever needs to become an Action step.)
      - name: Install git-cliff
        run: |
          set -euo pipefail
          version="2.14.2"
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${version}/git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf - -C /tmp "git-cliff-${version}/git-cliff"
          sudo install -m 0755 "/tmp/git-cliff-${version}/git-cliff" /usr/local/bin/git-cliff
          rm -rf "/tmp/git-cliff-${version}"
          git-cliff --version

      # "Nothing may merge between release preparation and tagging" as a
      # checked invariant rather than a discipline. The Changelog committed at
      # the tag is regenerated with the exact documented preparation commands
      # and diffed against itself; a mismatch means a commit landed between
      # the preparation commit and the tag. The guard runs before the section
      # rendering and before the build matrix starts, so the drift costs a
      # minute rather than four builds.
      - name: Check the Changelog against the tag
        run: |
          set -euo pipefail
          # The SAME commands as step 2 of "Cutting a release": one
          # implementation of what the Changelog should be, never a second one.
          git cliff --tag "${GITHUB_REF_NAME}" v0.1.0..HEAD -o /tmp/changelog.next
          printf '\n' >> /tmp/changelog.next
          awk '/^## \[0\.1\.0\]$/{f=1} f' CHANGELOG.md >> /tmp/changelog.next
          if ! diff -u CHANGELOG.md /tmp/changelog.next > /tmp/changelog.diff; then
            echo "::error::CHANGELOG.md at ${GITHUB_REF_NAME} does not match a regeneration from the commit range v0.1.0..HEAD: a commit landed between release preparation and tagging. Re-run release preparation against the actual tag range (it is idempotent); never hand-edit the generated sections."
            head -40 /tmp/changelog.diff
            exit 1
          fi
          echo "CHANGELOG.md at ${GITHUB_REF_NAME} matches the commit range"
          rm -f /tmp/changelog.diff /tmp/changelog.next

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          # The change section comes from the SAME source as CHANGELOG.md:
          # git-cliff with the repository's cliff.toml, over the same tag
          # range the documented release preparation uses. `--tag` labels the
          # section with the pushed tag; the range keeps the pre-conventional
          # history out, exactly as in the Changelog regeneration command.
          version="${GITHUB_REF_NAME#v}"
          section="$(
            git cliff --tag "${GITHUB_REF_NAME}" v0.1.0..HEAD \
              | awk -v heading="## [${version}]" '
                  # Everything between the version heading and the first
                  # footer link definition is the section. The heading is
                  # dropped (the notes carry their own title) and the link
                  # definitions end it (the notes are not a changelog file).
                  index($0, heading) == 1 { insec = 1; next }
                  insec && /^\[[^]]*\]: / { exit }
                  insec { lines[++n] = $0 }
                  END {
                    start = 1; while (start <= n && lines[start] == "") start++;
                    end = n;   while (end >= 1 && lines[end] == "") end--;
                    for (i = start; i <= end; i++) print lines[i]
                  }')"
          # A release with no change entries is not a release: an empty
          # section means the range held no conventional commits, which is a
          # tagging mistake to fix, not notes to publish. The explicit error
          # is the same defence the version guard uses against a check that
          # would otherwise pass vacuously.
          if [ -z "${section}" ]; then
            echo "::error::the generated change section for ${GITHUB_REF_NAME} is empty: no conventional commits between v0.1.0 and the tag"
            exit 1
          fi
          notes="release-notes.md"
          {
            # Only the title line interpolates. The hand-written text below is
            # passed as single-quoted arguments, so a future edit cannot
            # accidentally leave an unexpanded `$`, a backtick command, or a
            # stray version string in the published notes. (It is
            # `printf '%s\n' arg arg...` rather than a here-doc on purpose: a
            # here-doc's terminator would have to sit at column 0 of the
            # script, which YAML block-scalar indentation cannot express
            # without tab-tricks.)
            printf '# riff %s\n\n' "${GITHUB_REF_NAME}"
            # The first-release sentence is conditional on the tag: only
            # v0.1.0 is the first public release, so the 0.2.0 notes must not
            # claim it.
            if [ "${GITHUB_REF_NAME}" = "v0.1.0" ]; then
              printf '%s\n' 'The first public release of riff.' ''
            fi
            printf '%s\n' \
              'riff is pre-1.0, and it is offline-only by design: it plays the' \
              'audio files already on your own disks, opens no network' \
              'connection, and has no account, no telemetry, and no upload. Each' \
              'artifact below carries the compiled `riff` executable and nothing' \
              'else — no installer, no code signature. Point it at a folder of' \
              'music.' \
              ''
            # The generated section sits here: after the short introduction,
            # before the download table. Everything from the next printf on is
            # hand-written and retained verbatim — the download table, the
            # per-platform caveats, and the pre-release statement. They answer
            # a question the commit log cannot: what the artifact actually IS
            # on each platform.
            printf '%s\n' "${section}" \
              ''
            printf '%s\n' \
              '## Downloads' \
              '' \
              '| Platform | File |' \
              '|---|---|' \
              '| macOS, Apple silicon | `riff-<tag>-macos-arm64.dmg` |' \
              '| macOS, Intel | `riff-<tag>-macos-x86_64.dmg` |' \
              '| Linux, x86-64 | `riff-<tag>-linux-x86_64.tar.gz` |' \
              '| Windows, x86-64 | `riff-<tag>-windows-x86_64.exe` |' \
              '' \
              '`<tag>` stands for this release tag, so every file name starts with' \
              '`riff-` followed by it. Take the four downloads from this page' \
              'rather than assembling the names yourself.' \
              '' \
              '## What each platform actually gives you' \
              '' \
              '**Windows — the bare `riff.exe`,** straight from the build, with' \
              'no zip wrapper and no installer. The executable is unsigned, so' \
              'SmartScreen warns the first time you open it: choose "More info",' \
              'then "Run anyway". Wrapping this same unsigned binary in an NSIS' \
              'installer would hit the identical wall; an installer buys a setup' \
              'experience, not trust. Only a code-signing certificate buys' \
              'trust, and riff does not have one.' \
              '' \
              '**macOS — a `.dmg` containing `riff.app`,** with the riff brand' \
              'icon. The bundle is ad-hoc signed but NOT identified with Apple,' \
              'so Gatekeeper quarantines the download and blocks the first' \
              'launch. There is one extra step, and doing it BEFORE opening the' \
              'image is the easy way — it needs no password and no permission:' \
              '' \
              '    xattr -d com.apple.quarantine ~/Downloads/riff-*.dmg' \
              '' \
              'Run it on the file you actually downloaded, then open the image,' \
              'drag riff into Applications, and launch it. Do that first and it' \
              'just runs. (If the command complains — "no matches found" or' \
              '"No such xattr" — there was nothing left to clear, which is' \
              'harmless: the usual cause is a different download folder, or' \
              'running it twice.)' \
              '' \
              'The reason order matters: the quarantine attribute is not on the' \
              'app inside the image, it is copied onto the app when you drag it' \
              'out. Clearing it on the image first means the app never picks it' \
              'up at all.' \
              '' \
              'Already dragged it out? Then clear it where it landed instead:' \
              '' \
              '    xattr -dr com.apple.quarantine /Applications/riff.app' \
              '' \
              'That needs no time limit and clears either of the two warnings' \
              'macOS shows, but writing to /Applications may ask for your' \
              'password.' \
              '' \
              'If you would rather not use Terminal at all: launch riff and let' \
              'it fail, THEN go to System Settings → Privacy & Security → scroll' \
              'to the blocked app → "Open Anyway". The order is not optional —' \
              'that button only exists for about an hour after a blocked launch,' \
              'and it is not there at all if you open System Settings first.' \
              '(The old right-click → Open bypass no longer works on macOS' \
              'Sequoia and later.)' \
              '' \
              '**Linux — a `tar.gz` of the `riff` executable,** dynamically linked' \
              'against `libasound2` (ALSA). On Debian and Ubuntu:' \
              '' \
              '    sudo apt install libasound2' \
              '' \
              'There is no tray icon on Linux by design, so closing the window' \
              'quits.' \
              '' \
              '## This is a pre-release' \
              '' \
              'It is published as a GitHub pre-release while riff is pre-1.0,' \
              'and it is unsigned, so expect the caveats above rather than a' \
              'polished, trust-signed install experience. Reports and feature' \
              'requests:' \
              '' \
              'https://github.com/strawberry-choco/riff/issues'
          } > "${notes}"
          cat "${notes}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Build and package, but publish nothing. The publish step is a separate job
  # because a matrix job that also creates the release has a race built into it:
  # the first leg to finish creates the release and the other three fail with
  # "release already exists". Here every leg can only ever produce an artifact,
  # so the four legs cannot interfere with each other.
  build:
    name: build ${{ matrix.target }}
    # `notes` is required here so the changelog consistency guard completes
    # before any platform build starts: drift costs a minute, not four builds.
    needs: [verify, notes]
    strategy:
      # Not fail-fast: one broken leg should not cancel the other three, because
      # the failure report is much more useful when every platform reports.
      fail-fast: false
      matrix:
        include:
          # Runner labels are pinned to currently-GA images, and that is a
          # deliberate constraint rather than a preference. GitHub supports the
          # latest two macOS releases and deprecates the rest: a deprecated
          # image goes through announced brownouts and then disappears, and a
          # missing label fails the leg outright. `release` needs ALL four
          # legs, so one dead runner label blocks the entire release — there is
          # no partial publish. `macos-13` has already been removed from
          # actions/runner-images and `macos-14` is badged deprecated, so an
          # earlier draft of this matrix could not have run at all.
          #
          # Do not "simplify" these back to `macos-latest` for both legs:
          # `macos-latest` is arm64, so that would silently drop the Intel
          # build while the artifact name still claimed `macos-x86_64`. Intel
          # needs the explicit `macos-15-intel` label. Check the current table
          # in actions/runner-images before bumping either.
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    # Each leg builds natively on its own runner; `matrix.target` is a naming
    # slug, not a cargo `--target` triple, so no cross-compilation is involved.
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # eframe 0.35 (wgpu + winit x11/wayland + clipboard) and cpal 0.18 (ALSA)
      # need these headers to COMPILE on Linux. tray-icon/muda/rfd are gated to
      # non-Linux targets, so libgtk-3-dev is intentionally NOT required here.
      # mesa-vulkan-drivers provides the lavapipe software Vulkan adapter that
      # egui_kittest's wgpu renderer needs to run golden-image tests headless.
      #
      # Copied verbatim from ci.yml so the two lists cannot drift. It is a
      # superset of what `cargo build --release -p riff-gui` alone needs on
      # Linux (mesa-vulkan-drivers is for kittest's headless renderer, not for
      # running riff); the same list is kept so a change to either is a visible
      # edit in both files.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libssl-dev \
            mesa-vulkan-drivers

      # Successor to the archived actions-rs/toolchain, pinned to the same SHA
      # as ci.yml. No `components:` here: rustfmt and clippy are CI's concern,
      # and a release build wants nothing but the compiler.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release -p riff-gui

      # Nothing here is archived on Windows any more: the release asset IS the
      # executable. GitHub release assets must be single files, but a bare
      # `riff.exe` already is one, so the zip wrapper (and the unzip step it
      # forced on every user) is gone. The `if-no-files-found: error` upload
      # below is still the backstop for a packaging step that produced nothing.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # The Windows binary is riff.exe, not riff — the same path as on Unix
          # would silently package nothing.
          Copy-Item target/release/riff.exe dist/riff-${{ github.ref_name }}-windows-x86_64.exe
          if (-not (Test-Path "dist/riff-${{ github.ref_name }}-windows-x86_64.exe")) { throw "asset not produced: dist/riff-${{ github.ref_name }}-windows-x86_64.exe" }
          Write-Host "packaged dist/riff-${{ github.ref_name }}-windows-x86_64.exe"

      # Linux keeps a tar.gz of the bare binary. The Inter faces are
      # `include_bytes!`-ed and the Lucide SVGs are `include_str!`-ed by
      # `crates/riff-gui/src/ui/fonts.rs` and `.../icons.rs`, so the executable
      # carries its own fonts and icons — no assets folder is needed, and the
      # binary is the whole product.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/riff-${{ github.ref_name }}-linux-x86_64.tar.gz"
          # -C target/release + a bare member name keeps the archive flat: one
          # entry, `riff`, with no `target/release/` prefix around it.
          tar -czf "${archive}" -C target/release riff
          echo "packaged ${archive}"

      # macOS ships a real .app bundle inside a .dmg: the bundle gets the brand
      # icon (crates/riff-gui/assets/brand/riff.icns, the packaging copy of the
      # mark that chrome.rs generates at runtime), a Dock icon, and the
      # drag-to-Applications install gesture via the /Applications symlink.
      # The bundle is ad-hoc signed (`codesign -s -`), which is what an arm64
      # Mach-O needs to run at all; it is NOT identified with Apple, so
      # Gatekeeper still quarantines the download (caveat in the release
      # notes). hdiutil UDZO is the stock compressed read-only image format —
      # no third-party tooling, no license concerns.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="dist/riff.app"
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp target/release/riff "${app}/Contents/MacOS/riff"
          cp crates/riff-gui/assets/brand/riff.icns "${app}/Contents/Resources/riff.icns"
          version="${GITHUB_REF_NAME#v}"
          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>riff</string>
            <key>CFBundleDisplayName</key><string>riff</string>
            <key>CFBundleExecutable</key><string>riff</string>
            <key>CFBundleIdentifier</key><string>io.github.strawberry-choco.riff</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>riff</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature on the binary first, then the bundle (so the seal
          # covers Info.plist and the resources). `-s -` needs no certificate.
          codesign --force -s - "${app}/Contents/MacOS/riff"
          codesign --force -s - "${app}"
          # Standard dmg layout: the app plus an Applications symlink, so the
          # Finder window reads "drag riff into Applications".
          stage="$(mktemp -d)"
          cp -R "${app}" "${stage}/"
          ln -s /Applications "${stage}/Applications"
          dmg="dist/riff-${{ github.ref_name }}-${{ matrix.target }}.dmg"
          hdiutil create -volname "riff" -srcfolder "${stage}" -ov -format UDZO "${dmg}"
          rm -rf "${stage}"
          echo "packaged ${dmg}"

      # `if-no-files-found: error` is the backstop for the packaging steps above
      # silently producing nothing: an empty artifact would otherwise be
      # uploaded, merged into the staging directory, and published as a
      # 0-byte download.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riff-${{ github.ref_name }}-${{ matrix.target }}-${{ runner.os == 'macOS' && 'dmg' || runner.os == 'Windows' && 'exe' || 'tar.gz' }}
          path: ${{ runner.os == 'macOS' && 'dist/*.dmg' || runner.os == 'Windows' && 'dist/*.exe' || 'dist/*.tar.gz' }}
          if-no-files-found: error

  release:
    name: publish pre-release
    # `build` depends on `verify` and `notes`, so a version mismatch or a
    # changelog-drift failure already stopped the run before any of this is
    # reached — the notes transitively, since the build matrix cannot start
    # until they exist. The only thing between four finished builds plus
    # generated notes and a published release is this one job.
    needs: [build]
    runs-on: ubuntu-latest
    # The ONLY grant of write scope in this workflow, and the reason the
    # workflow-level default above is `contents: read`. `gh release create` is
    # the single write; nothing in the build matrix has it.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job never checks the repository out, so `gh` has no git remote to
      # infer the target repository from and would fail with "unable to
      # determine base repository". Name the repository explicitly instead of
      # paying for a full checkout to get it.
      GH_REPO: ${{ github.repository }}
    steps:
      # The build artifacts merge into one flat staging directory — correct
      # precisely because the four names differ, so flattening cannot collide.
      # The `pattern` keeps the release-notes artifact out of the merge: the
      # notes are downloaded separately below and assets and notes must never
      # share a directory, so nothing that lists or globs release-assets can
      # ever pick the notes file up as an asset.
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: riff-*
          path: release-assets
          merge-multiple: true

      # The notes land in their own directory for the same reason the assets
      # are merged into theirs: the two download scopes must not mix. The
      # publish job itself stays checkout-free — the notes arrive as an
      # artifact, not from a git checkout.
      - name: Download the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes

      - name: Create the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          # The same four slugs the build matrix uses. This list is the
          # contract: if a target is renamed in the matrix, it has to change
          # here too, and the existence check below is what turns a stale list
          # into a clear error instead of a release that is quietly missing a
          # platform.
          assets=()
          for target in macos-arm64 macos-x86_64 linux-x86_64 windows-x86_64; do
            case "${target}" in
              macos-*) ext="dmg" ;;
              windows-*) ext="exe" ;;
              *) ext="tar.gz" ;;
            esac
            assets+=("release-assets/riff-${GITHUB_REF_NAME}-${target}.${ext}")
          done
          for asset in "${assets[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "::error::expected release asset is missing: ${asset}"
              echo "The download step merged: $(ls -1 release-assets)"
              exit 1
            fi
          done
          # Always a pre-release, whatever the tag says: riff is pre-1.0 and
          # the binaries are unsigned — no identified Apple signature, no
          # Windows Authenticode certificate. Promoting out of pre-release is
          # a deliberate manual act, not a side effect of the tag.
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "riff ${GITHUB_REF_NAME}" \
            --notes-file release-notes/release-notes.md \
            "${assets[@]}"
