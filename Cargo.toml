# Workspace: riff music player split into backend capability crates + frontend.
#
# Pure virtual workspace: this directory owns no source files, no library,
# no binary, and no integration tests. The actual code lives in:
#   * `riff-persistence` — stored entities + Application Store contract (std-only)
#   * `riff-library`     — collection capability slice (pure Rust)
#   * `riff-playback`    — playback capability slice (pure Rust)
#   * `riff-infra`       — every port implementation + every native dependency
#   * `riff-backend`     — application API: facade, services, Composition Root
#   * `riff-gui-theme`   — design authority: token/palette store, fonts, icons,
#                          and the assets those are compiled in from
#   * `riff-gui-components` — presentation primitives (props in, a response or
#                          a typed intent out); depends on riff-gui-theme
#   * `riff-gui`         — frontend (egui UI, tray, native dialogs) + the `riff`
#                          binary entry point (a thin composition over
#                          `riff_backend::composition::AppRuntime::spawn`)
#   * `tests`            — the workspace-root integration-test crate (package
#                          `riff-tests`); per-crate adapter tests live in
#                          `riff-infra/tests/`
#
# Build / run from here:
#   cargo run -p riff-gui
#   cargo test --all-targets
#   cargo build --release -p riff-gui

[workspace]
members = [
    "crates/riff-persistence",
    "crates/riff-playback",
    "crates/riff-library",
    "crates/riff-infra",
    "crates/riff-backend",
    "crates/riff-gui-theme",
    "crates/riff-gui-components",
    "crates/riff-gui",
    "tests",
]
resolver = "2"

# Single source of truth for the version, edition, MSRV and the identity fields
# that every member inherits via `<key>.workspace = true`. Releases touch this
# one block instead of nine manifests, so the crates can never disagree.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["strawberry-choco"]
repository = "https://github.com/strawberry-choco/riff"
homepage = "https://github.com/strawberry-choco/riff"
documentation = "https://github.com/strawberry-choco/riff/tree/master/docs"

# The GUI toolkit pin, stated exactly once for every crate that names the
# toolkit; members inherit it via `egui.workspace = true`.
[workspace.dependencies]
# egui is pinned to 0.35 deliberately. 0.36 regressed headless texture
# rendering: under kittest the golden snapshots silently lose every
# user-loaded texture, because `ctx.load_texture` and the painter/image
# widgets paint nothing while text and shapes still render. That partial
# failure is what makes it easy to miss — the windowed app looks fine on
# either version, and the damage lands entirely in the committed goldens.
# Revisit only after checking the upstream fix status; do not bump the pin
# to "catch up" and re-baseline the snapshots to make the diff go away.
egui = "0.37"

# Workspace-level profiles and lints apply to every member.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.lints.rustdoc]
# Allowed deliberately. These crates are internal — nothing here is published
# or consumed by an outside reader — so a public doc comment that links to a
# private item is a maintainer's cross-reference, not a broken promise to an
# API consumer. The lint's premise (the public docs hide the target) does not
# apply, and `--document-private-items` documents the target anyway; rustdoc
# still fires the lint in that mode, so the level has to be set once here.
# Rewriting these links as plain backticks would trade real navigation for
# a clean warning list.
private_intra_doc_links = "allow"
