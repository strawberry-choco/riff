[package]
name = "riff"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["riff contributors"]
description = "A lightweight, offline-first music player built in Rust with egui"
license = "MIT OR Apache-2.0"
# The test suite is a single integration-test crate rooted at `tests/mod.rs`
# (see `docs/engineering/testing-strategy.md`). Disable cargo's default
# auto-discovery so each `tests/*_tests.rs` file is NOT compiled as its own
# separate crate (they are modules of `tests/mod.rs`).
autotests = false

[[test]]
name = "integration"
path = "tests/mod.rs"

[dependencies]
# UI
egui = "0.36"
eframe = { version = "0.36", features = ["default", "persistence"] }

# Audio decoding (pure Rust)
symphonia = { version = "0.6", features = ["all"] }
# Opus codec adapter (symphonia lacks native Opus decoder)
symphonia-adapter-libopus = "0.3"

# Audio output (cross-platform)
cpal = "0.18"

# Metadata reading (pure Rust)
lofty = "0.25"

# Image decoding for cover art
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# File system scanning
walkdir = "2"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config directories
directories = "6"

# Threading / sync
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
parking_lot = "0.12"

# Filesystem watching
notify = "8"

# Random for shuffle
rand = "0.10"

# For image data in egui
epi = { package = "egui_extras", version = "0.36", features = ["image"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Lucide icon glyph rasterization for the shell chrome (Issue 06)
resvg = "0.48"

# Testing dependencies
[dev-dependencies]
tempfile = "3.8"
# The integration tests assert theme tokens against egui color values.
egui = "0.36"
# Golden-image snapshot tests render real egui frames headlessly (Issue 05);
# wgpu provides the offscreen renderer, snapshot the image comparison.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# System tray (macOS/Windows only — requires GTK dev libs on Linux)
tray-icon = "0.24"
muda = "0.19"
# Native file dialog (macOS/Windows only — Linux uses text input)
rfd = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
