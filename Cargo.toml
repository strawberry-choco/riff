# Workspace: riff music player split into backend + frontend crates.
#
# Pure virtual workspace: this directory owns no source files, no library,
# no binary, and no integration tests. The actual code lives in:
#   * `riff-backend` — headless backend (domain, app, infra, store, workers)
#   * `riff-gui`     — frontend (egui UI, tray, native dialogs) + the `riff`
#                       binary entry point (composition root in
#                       `riff-gui/src/main.rs`)
#   * `tests`        — the integration-test crate (package `riff-tests`)
#
# Build / run from here:
#   cargo run              -p riff-gui
#   cargo test --all-targets
#   cargo build --release  -p riff-gui

[workspace]
members = ["riff-persistence", "riff-playback", "riff-library", "riff-backend", "riff-gui", "tests"]
resolver = "2"

# Workspace-level profiles and lints apply to every member.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
