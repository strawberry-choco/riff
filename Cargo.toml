[package]
name = "riff"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
authors = ["riff contributors"]
description = "A lightweight, offline-first music player built in Rust with egui"
license = "MIT OR Apache-2.0"

[dependencies]
# UI
egui = "0.34.3"
eframe = { version = "0.34.3", features = ["default", "persistence"] }
egui-elegance = "0.13"

# Audio decoding (pure Rust)
symphonia = { version = "0.5", features = ["all"] }
# Opus codec adapter (symphonia 0.5 lacks native Opus decoder)
symphonia-adapter-libopus = "0.2"

# Audio output (cross-platform)
cpal = "0.18"

# Metadata reading (pure Rust)
lofty = "0.19"

# Image decoding for cover art
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# File system scanning
walkdir = "2"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization for state persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config directories
directories = "5"

# Threading / sync
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
parking_lot = "0.12"

# Filesystem watching
notify = "7"

# Random for shuffle
rand = "0.8"

# For image data in egui
epi = { package = "egui_extras", version = "0.34.3", features = ["image"] }

# Testing dependencies
[dev-dependencies]
tempfile = "3.8"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# System tray (macOS/Windows only — requires GTK dev libs on Linux)
tray-icon = "0.19"
muda = "0.15"
# Native file dialog (macOS/Windows only — Linux uses text input)
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
