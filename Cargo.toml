# Workspace: riff music player split into backend capability crates + frontend.
#
# Pure virtual workspace: this directory owns no source files, no library,
# no binary, and no integration tests. The actual code lives in:
#   * `riff-persistence` — stored entities + Application Store contract (std-only)
#   * `riff-library`     — collection capability slice (pure Rust)
#   * `riff-playback`    — playback capability slice (pure Rust)
#   * `riff-infra`       — every port implementation + every native dependency
#   * `riff-backend`     — application API: facade, services, Composition Root
#   * `riff-gui-nsh`     — the frontend (nsh UI) + the `riff` binary entry
#                          point: a thin composition over
#                          `riff_backend::composition::AppRuntime::spawn`. It
#                          owns the ported design system (palette, tokens,
#                          fonts, icons) too.
#   * `tests`            — the workspace-root integration-test crate (package
#                          `riff-tests`); per-crate adapter tests live in
#                          `riff-infra/tests/`
#
# Build / run from here:
#   cargo run
#   cargo test --all-targets
#   cargo build --release

[workspace]
members = [
    "crates/riff-persistence",
    "crates/riff-playback",
    "crates/riff-library",
    "crates/riff-infra",
    "crates/riff-backend",
    "crates/riff-gui-nsh",
    "tests",
]
# Resolver 2, deliberately, though every member is edition 2024 and the nsh
# plan asked for 3. Resolver 3 adds MSRV-aware resolution, which can select
# older-than-newest versions for crates whose newest needs a higher MSRV.
# Resolver 2 already does the per-target feature unification the nsh graph
# relies on, and the workspace's lock entries stay stable across the flip.
resolver = "2"

# Single source of truth for the version, edition, MSRV and the identity fields
# that every member inherits via `<key>.workspace = true`. Releases touch this
# one block instead of nine manifests, so the crates can never disagree.
[workspace.package]
version = "0.2.0"
edition = "2024"
# 1.97, not 1.95: nsh-core, nsh-base, nsh-engine, nsh-macros and
# nsh-platform-windows all declare `rust-version = "1.97"` in their own
# manifests. The floor is the framework's, so it is the workspace's.
# clippy.toml carries the same string and changes in the same commit.
rust-version = "1.97"
license = "Apache-2.0"
authors = ["strawberry-choco"]
repository = "https://github.com/strawberry-choco/riff"
homepage = "https://github.com/strawberry-choco/riff"
documentation = "https://github.com/strawberry-choco/riff/tree/master/docs"

[workspace.dependencies]
# The nsh UI stack, pinned exactly and aligned as one set. All seven publish
# 0.6.1 and it is the newest non-yanked version of each (P0 memo, Version
# alignment). The plan's block pinned nsh-core at "=0.6.0" against six at
# 0.6.1; that set is misaligned and 0.6.1 supersedes it.
#
# An entry here binds only when a member inherits it. nsh-engine is inherited
# by riff-gui-nsh at N1 for exactly that reason: the platform crates require
# it on a caret range, so without a member consuming the exact pin the
# resolver could take a later 0.6.x and misalign the set.
#
# default-features = false on nsh-base and nsh-engine is load-bearing, not
# decoration. nsh-base's default is editor, highlight, plot, rich-editor,
# term; nsh-engine's default is js, which pulls QuickJS through nsh-js.
# Feature unification is a union across the workspace, so inheriting either
# with defaults on re-enables what the platform feature lists below turn
# off. The generated template's "minimal" lock still carries syntect and
# two-face for exactly this reason.
#
# The platform feature list is IDENTICAL on all three OSes: shader for the
# GPU path (wgpu, naga and pollster are already locked at these versions for
# egui_kittest, so keeping it adds no package), svg for the Lucide icons N2
# ports. A wrong svg drop is a compile_error from nsh-core's __require_svg!,
# not a silent blank icon. Everything the generated template enables beyond
# these two is a component riff never renders or a network stack an
# offline-first player must not carry.
#
# The crates.io crate named `nsh` is an unrelated shell project. Never add it.
nsh-core = "=0.6.1"
nsh-base = { version = "=0.6.1", default-features = false }
nsh-engine = { version = "=0.6.1", default-features = false }
# nsh-testing's `default` is `live`, its ureq HTTP stack for fetch-driving
# tests. riff is offline-first and its headless tests fetch nothing, so the
# stack stays out of the graph.
nsh-testing = { version = "=0.6.1", default-features = false }
nsh-platform-windows = { version = "=0.6.1", default-features = false, features = ["shader", "svg"] }
nsh-platform-linux = { version = "=0.6.1", default-features = false, features = ["shader", "svg"] }
nsh-platform-macos = { version = "=0.6.1", default-features = false, features = ["shader", "svg"] }

# Workspace-level profiles and lints apply to every member.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.lints.rustdoc]
# Allowed deliberately. These crates are internal — nothing here is published
# or consumed by an outside reader — so a public doc comment that links to a
# private item is a maintainer's cross-reference, not a broken promise to an
# API consumer. The lint's premise (the public docs hide the target) does not
# apply, and `--document-private-items` documents the target anyway; rustdoc
# still fires the lint in that mode, so the level has to be set once here.
# Rewriting these links as plain backticks would trade real navigation for
# a clean warning list.
private_intra_doc_links = "allow"
