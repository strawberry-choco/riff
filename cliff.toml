# git-cliff configuration for riff's CHANGELOG.md.
#
# This file is the single place the changelog catalog lives: which commit
# type maps to which Keep a Changelog section, and which types are hidden.
# Extending the catalog means editing this file, not a document and a
# config together.
#
# Regeneration is a pure function of the git state (see "Cutting a release"
# in docs/engineering/release-and-packaging.md): `git cliff` writes every
# generated section from the tags, and the hand-written 0.1.0 section is
# appended byte-for-byte from the existing file. Running it twice therefore
# produces the same file.
#
# Verified against git-cliff 2.14.x.

[changelog]
# The generated header reproduces the standing CHANGELOG.md preamble
# verbatim — the pre-0.1.0 history note and the Conventional Commits
# promise included, both untouched — plus the generated-artifact
# declaration beside the Keep a Changelog / SemVer lines.
header = """
# Changelog

All notable changes to riff are recorded in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

**This file is generated by [git-cliff](https://git-cliff.github.io/) — do not edit it by hand.**

## About the history before 0.1.0

**Everything before 0.1.0 predates this file and is not in Keep a Changelog form.**
The pre-release commit history is freeform — `add animation`, `improve ui`,
`refactor`, and so on — with no conventional-commit prefixes, no pull-request
numbers, and no changelog file to append to. Nothing has been retro-fitted: the
per-commit detail exists only in the commit log, and reconstructing a
per-release or per-PR changelog from it would mean inventing structure and
attribution that the history does not contain.

[Conventional Commits](https://www.conventionalcommits.org/) are adopted **going
forward only**, starting with the next commit. From then on, commit messages
follow the format, and each release's section here is written from the commits
and pull requests between the previous tag and the new one.

"""
# One heading per release, then Keep a Changelog subsections from the
# commit groups below. The [Unreleased] section renders only when there
# are unreleased commits, so a regeneration after the tag exists matches
# the file the preparation step produced. The whitespace-control layout
# (minus signs and trailing backslashes) follows git-cliff's official
# keepachangelog example — do not "simplify" it.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}]{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# Footer link definitions, regenerated fresh on every run: each release
# compares against the one before it, the oldest generated release
# compares against v0.1.0, and Unreleased compares the latest release
# against HEAD. Tera's set_global carries the previous version through
# the oldest-first loop.
footer = """\
{% set_global prev = "v0.1.0" %}\
{% for release in releases | reverse %}\
{% if release.version %}\
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/strawberry-choco/riff/compare/{{ prev }}...{{ release.version }}
{% set_global prev = release.version %}\
{% endif %}\
{% endfor %}\
[Unreleased]: https://github.com/strawberry-choco/riff/compare/{{ prev }}...HEAD
[0.1.0]: https://github.com/strawberry-choco/riff/releases\
"""
trim = true

[git]
# Parse only conventional commits; anything else (the pre-conventional
# history, for instance) is never read or rewritten.
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
# The hand-written 0.1.0 section is never generated: its tag is ignored
# (its commits are freeform and filtered out anyway) and the section is
# appended from the existing file by the documented release-prep command.
ignore_tags = "v0.1.0"
topo_order = false
sort_commits = "oldest"

# The type-to-section catalog. `feat` and `fix` are the only two types
# that reach a visible section; `refactor`, `perf`, and `deps` land in
# the Changed section; everything else is hidden and never affects a
# version bump.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^deps", group = "Changed" },
  # Hidden types.
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^revert", skip = true },
  # Anything else that somehow reaches the range is hidden too.
  { message = ".*", skip = true },
]

[bump]
# Pinned pre-1.0 version semantics — set here explicitly rather than
# inherited from defaults, so "is this a minor or a major" is answered by
# a rule rather than by taste at release time.
#
# A feature bumps the minor version, even while the major version is
# zero. (Git-cliff's default at 0.x is a patch bump; this pins minor.)
features_always_bump_minor = true
# A breaking change bumps the MINOR version while the major version is
# zero. (Git-cliff's default is a major bump; this pins minor. After 1.0
# the standard SemVer rule resumes, which is the intended behaviour.)
breaking_always_bump_major = false
# A fix or a performance change bumps the patch version. That is
# git-cliff's default behaviour and needs no key; stated here so the
# whole rule table is readable in one place.
