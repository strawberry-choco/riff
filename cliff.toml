# git-cliff configuration for riff's release notes.
#
# This file is the single place the catalog lives: which commit type maps
# to which release-notes section, and which types are hidden. Extending
# the catalog means editing this file, not a document and a config
# together.
#
# The only consumer is the GitHub release workflow: release.yml renders
# each release's change section from the tag range with this config
# (see "Cutting a release" in docs/engineering/release-and-packaging.md).
# There is no CHANGELOG.md, and the rendered section is not cached
# anywhere in the repository.
#
# Verified against git-cliff 2.14.x.

[changelog]
# No file preamble and no footer link definitions: those existed for the
# former CHANGELOG.md, and the workflow's section extractor reads only
# what the body template renders between the version heading and the
# first footer link line. Both are pinned empty so git-cliff's built-in
# defaults cannot leak a preamble or link block into the rendered output.
header = ""
footer = ""
# One heading per release, then Keep a Changelog subsections from the
# commit groups below. The [Unreleased] branch renders only in a
# full-history render without `--tag`; the workflow always passes the
# pushed tag, so every rendered section is a release. The
# whitespace-control layout (minus signs and trailing backslashes)
# follows git-cliff's official keepachangelog example — do not
# "simplify" it.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}]{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {% if commit.breaking %}**breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
# The whole history is Conventional Commits (ADR 0016). `filter_unconventional`
# stays OFF on purpose: after the retrofit nothing in the log is
# unconventional, so the filter's only remaining power would be to silently
# hide a non-conforming commit that slipped past the gates — the failure mode
# the commit conventions document exists to prevent. A regression must show
# up in the rendered notes, never be absorbed.
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
# The pre-conventional era has no generated section (D6: the retrofit does
# not reconstruct per-release notes for a time that predates the tooling) —
# its tag is ignored so a full-history render never fabricates one for it.
# The release workflow bounds every render with the explicit
# `v0.1.0..HEAD` range regardless, so this is the second line of defence.
ignore_tags = "v0.1.0"
topo_order = false
sort_commits = "oldest"

# The type-to-section catalog. `feat` and `fix` are the only two types
# that reach a visible section; `refactor`, `perf`, and `deps` land in
# the Changed section; everything else is hidden and never affects a
# version bump. A `!`-marked breaking commit is parsed FIRST and given
# its own section whatever its type is; a footer-marked one keeps its
# type's section and is flagged inline in the body template below.
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking changes" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^deps", group = "Changed" },
  # Hidden types.
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^revert", skip = true },
  # Anything else that somehow reaches the range is hidden too.
  { message = ".*", skip = true },
]

[bump]
# Pinned pre-1.0 version semantics — set here explicitly rather than
# inherited from defaults, so "is this a minor or a major" is answered by
# a rule rather than by taste at release time.
#
# A feature bumps the minor version, even while the major version is
# zero. (Git-cliff's default at 0.x is a patch bump; this pins minor.)
features_always_bump_minor = true
# A breaking change bumps the MINOR version while the major version is
# zero. (Git-cliff's default is a major bump; this pins minor. After 1.0
# the standard SemVer rule resumes, which is the intended behaviour.)
breaking_always_bump_major = false
# A fix or a performance change bumps the patch version. That is
# git-cliff's default behaviour and needs no key; stated here so the
# whole rule table is readable in one place.
