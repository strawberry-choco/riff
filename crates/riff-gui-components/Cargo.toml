# riff-gui-components — the presentation primitives of riff's widgetry
# (ADR 0018).
#
# Membership criterion: a presentation primitive — props in, a response or a
# typed intent out. A primitive paints from the palette tokens it is handed,
# mutates nothing but caller-owned buffers, and reports what the user did; it
# decides nothing about the application.
#
# No `riff-*` crate may be named by this one: the manifest takes
# `riff-gui-theme` and `egui` and nothing else, so the manifest edge is the
# boundary — an offending import fails the build rather than a source sweep.

[package]
name = "riff-gui-components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
egui.workspace = true
riff-gui-theme = { path = "../riff-gui-theme" }

# The component probes render real egui frames headlessly (kittest + wgpu).
# No `snapshot` feature: the probes assert on pixels and responses, never
# on a committed baseline — the golden images stay in the root `riff-tests`
# crate.
[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu"] }
# Counting pixels in headlessly rendered frames.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
