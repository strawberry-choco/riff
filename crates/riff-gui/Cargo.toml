# riff-gui — the frontend: egui UI, tray icon, native dialogs, fonts, and the
# `riff` binary entry point.
#
# Owns egui/eframe, egui_kittest, resvg, rfd, and tray-icon/muda.
#
# egui is pinned to 0.35 deliberately. 0.36 regressed headless texture
# rendering: under kittest the golden snapshots silently lose every
# user-loaded texture, because `ctx.load_texture` and the painter/image
# widgets paint nothing while text and shapes still render. That partial
# failure is what makes it easy to miss — the windowed app looks fine on
# either version, and the damage lands entirely in the committed goldens.
# Revisit only after checking the upstream fix status; do not bump the pin
# to "catch up" and re-baseline the snapshots to make the diff go away.
#
# The binary is a thin composition over the backend's Composition Root
# (`riff_backend::composition::AppRuntime::spawn`, backend-crate-split
# issue 08): every adapter dependency lives in `riff-infra`, and this crate
# depends on riff-backend only (plus UI/platform dependencies).
#
# The crate's own suite lives in `./tests/` (`scroll_memory_tests.rs`, the
# Scroll Memory's protocol at its own interface); the cross-crate integration
# suite and the golden snapshots live at the workspace root in the root
# `./tests/` crate, which declares this crate as a dev-dependency.

[package]
name = "riff-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The riff desktop music player: an offline-first egui app for playing a local music library."
readme = "../../README.md"
keywords = ["music-player", "audio", "egui", "desktop", "offline"]
categories = ["multimedia", "gui"]

[[bin]]
name = "riff"
path = "src/main.rs"

[dependencies]
riff-backend = { path = "../riff-backend" }

# UI
egui = "0.35"
eframe = { version = "0.35", features = ["default", "persistence"] }
epi = { package = "egui_extras", version = "0.35", features = ["image"] }

# Lucide icon glyph rasterization for the shell chrome
resvg = "0.48"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error reporting: pretty panic reports with backtrace + span trace.
color-eyre = "0.6"

# Threading / sync (frontend-local visibility channel)
crossbeam-channel = "0.5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.24"
muda = "0.19"
rfd = "0.17"

[dev-dependencies]
egui = "0.35"

[lints]
workspace = true
