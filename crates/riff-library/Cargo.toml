# riff-library - the collection capability slice.
#
# Pure-Rust crate owning the library domain: scanning, filesystem watching,
# Session Projections and views, playlist management, tag editing, cover
# resolution and service. Depends only on riff-persistence + pure-Rust utils.
# No edge to riff-playback, no native dependencies.
#
# riff-backend re-exports this surface at its historical qualified paths
# so the frontend and integration tests keep their existing imports.

[package]
name = "riff-library"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
riff-persistence = { path = "../riff-persistence" }
crossbeam-channel = "0.5"
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true