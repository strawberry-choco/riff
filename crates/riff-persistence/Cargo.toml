# riff-persistence — the stored entities and the Application Store contract.
#
# Everything that crosses the persistence boundary lives here: the stored
# entities (tracks, albums, artists, playlists) and the Store ports plus
# their DTOs. It implements nothing — the SQLite adapter lives in
# `riff-infra` — and it carries NO external dependencies: `std` only, so the
# persistence contract never drags in an audio, image, or database crate.
#
# `riff-backend` re-exports this crate's surface at its historical qualified
# paths (`riff_backend::domain`, `riff_backend::app::store`, ...), so the
# frontend and the integration tests keep their existing imports.

[package]
name = "riff-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Stored entity types and the store interface for riff, with no external dependencies."
publish = false

