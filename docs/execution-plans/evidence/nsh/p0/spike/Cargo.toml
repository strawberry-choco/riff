[workspace]

[package]
name = "riff-gui-nsh-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "riff_gui_nsh_spike"
path = "src/lib.rs"

[[bin]]
name = "riff-nsh-spike"
path = "src/main.rs"

[dependencies]
nsh-core = "=0.6.1"
nsh-base = "=0.6.1"
env_logger = "0.11"
log = "0.4"
riff-backend = { path = "../../../../../../crates/riff-backend" }
riff-playback = { path = "../../../../../../crates/riff-playback" }
riff-library = { path = "../../../../../../crates/riff-library" }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = "=0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "=0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "=0.6.1"

[dev-dependencies]
nsh-engine = "=0.6.1"
nsh-testing = "=0.6.1"

[profile.release]
lto = true
codegen-units = 1
strip = true