# riff-backend — the headless backend: domain, app, infra, worker threads.
#
# Owns audio decoding, audio output, metadata reading/writing, cover loading,
# filesystem scanning, filesystem watching, and the SQLite Application Store.
# Contains NO UI crate dependencies (egui/eframe/kittest/resvg).
#
# Publicly re-exports every module under app/, domain/, infra/ so the root
# `riff` package can re-export `riff::app`, `riff::domain`, `riff::infra`.

[package]
name = "riff-backend"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
# Persistence contract: the stored entities and the Application Store ports
# (extracted to `riff-persistence` by backend-crate-split issue 04; re-exported
riff-persistence = { path = "../riff-persistence" }

# Playback capability (extracted to `riff-playback` by backend-crate-split issue 05;
# re-exported below at the historical `riff_backend::domain::playback` /
# `app::transport` / `app::playback_coordinator` / `app::state` paths).
riff-playback = { path = "../riff-playback" }

# Library capability (extracted to `riff-library` by backend-crate-split issue 06;
# re-exported below at the historical `riff_backend::app::scan` / `app::scan_service`
# / `app::playlist_manager` / `app::tag_edit_service` / `app::cover_service`
# / `app::watcher_manager` / `app::projection` / `app::views` paths).
riff-library = { path = "../riff-library" }

# Audio decoding (pure Rust)
symphonia = { version = "0.6", features = ["all"] }
symphonia-adapter-libopus = "0.3"

# Audio output (cross-platform)
cpal = "0.18"

# Lock-free SPSC ring buffer between the decoder thread and the cpal callback
ringbuf = "0.5"

# Metadata reading (pure Rust)
lofty = "0.25"

# Image decoding for cover art
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# File system scanning
walkdir = "2"

# SQLite Application Store
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Config directories
directories = "6"

# Threading / sync
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"

# Filesystem watching
notify = "8"
notify-debouncer-full = "0.7"

# Random for shuffle
fastrand = "2"

[dev-dependencies]
tempfile = "3.8"
crossbeam-channel = "0.5"


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"