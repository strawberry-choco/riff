# riff-backend — the application API: Backend Facade, typed events and
# notices, facade transport, and the Composition Root.
#
# Owns the facade and its event surface, the Composition Root (the one place
# that names both the slice-defined ports and the concrete `riff-infra`
# adapters), and the worker threads those adapters run. This crate carries no
# native dependencies of its own and NO UI crate dependencies
# (egui/eframe/kittest/resvg).
#
# Re-exports the read-side surface the frontend renders (entities, Session
# Views, projections, Transport) so the frontend keeps one dependency.
# Concrete adapters are NOT re-exported — only the Composition Root names
# them.

[package]
name = "riff-backend"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[dependencies]
# Persistence contract: the stored entities and the Application Store ports
# (extracted to `riff-persistence` by backend-crate-split issue 04; re-exported
riff-persistence = { path = "../riff-persistence" }

# Playback capability (extracted to `riff-playback` by backend-crate-split issue 05;
# re-exported below at the historical `riff_backend::domain::playback` /
# `app::transport` / `app::playback_coordinator` / `app::state` paths).
riff-playback = { path = "../riff-playback" }

# Library capability (extracted to `riff-library` by backend-crate-split issue 06;
# re-exported below at the historical `riff_backend::app::scan` / `app::scan_service`
# / `app::playlist_manager` / `app::tag_edit_service` / `app::cover_service`
# / `app::watcher_manager` / `app::projection` / `app::views` paths).
riff-library = { path = "../riff-library" }

# Adapter crate (extracted to `riff-infra` by backend-crate-split issue 07;
# named only by the Composition Root in src/composition.rs).
riff-infra = { path = "../riff-infra" }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Threading / sync
crossbeam-channel = "0.5"

# Random for shuffle
fastrand = "2"

[dev-dependencies]
# The scan_bench example builds a synthetic library fixture in a tempdir.
tempfile = "3.8"

[lints]
workspace = true
