    <style id="theme-vars">
/* riff UI Redesign — Design Tokens */

:root {
  /* Brand hue: warm amber */
  --riff-brand-50: #fff8e7;
  --riff-brand-100: #ffefcc;
  --riff-brand-200: #ffe099;
  --riff-brand-300: #ffcc66;
  --riff-brand-400: #ffb833;
  --riff-brand-500: #f5a623;
  --riff-brand-600: #d98a0d;
  --riff-brand-700: #a66709;

  /* Neutral surfaces — deep ink */
  --riff-bg: #0c0c10;
  --riff-surface: #13131a;
  --riff-surface-2: #1b1b24;
  --riff-surface-3: #23232e;

  /* Text */
  --riff-ink: #f4f4f5;
  --riff-ink-2: #a1a1aa;
  --riff-ink-3: #71717a;

  /* Lines */
  --riff-line: rgba(255, 255, 255, 0.08);
  --riff-border: rgba(255, 255, 255, 0.10);

  /* Semantic aliases required by head contract */
  --riff-background: var(--riff-bg);
  --riff-foreground: var(--riff-ink);
  --riff-card: var(--riff-surface);
  --riff-card-foreground: var(--riff-ink);
  --riff-popover: var(--riff-surface-2);
  --riff-popover-foreground: var(--riff-ink);
  --riff-primary: var(--riff-brand-500);
  --riff-primary-foreground: #0c0c10;
  --riff-secondary: var(--riff-surface-2);
  --riff-secondary-foreground: var(--riff-ink);
  --riff-muted: var(--riff-surface-2);
  --riff-muted-foreground: var(--riff-ink-2);
  --riff-accent: var(--riff-surface-3);
  --riff-accent-foreground: var(--riff-ink);
  --riff-destructive: #ef4444;
  --riff-destructive-foreground: #ffffff;
  --riff-border: var(--riff-border);
  --riff-input: var(--riff-surface-2);
  --riff-ring: var(--riff-brand-500);

  /* Status colors */
  --riff-state-success: #22c55e;
  --riff-state-warning: var(--riff-brand-500);
  --riff-state-error: #ef4444;
  --riff-state-info: #3b82f6;

  /* Radius */
  --riff-radius-sm: 4px;
  --riff-radius-md: 8px;
  --riff-radius-lg: 12px;
  --riff-radius-xl: 16px;
  --riff-radius-full: 999px;

  /* Shadows */
  --riff-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.15);
  --riff-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --riff-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.60);

  /* Typography */
  --riff-font-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --riff-font-mono: "SF Mono", "Fira Code", ui-monospace, monospace;

  /* App chrome dimensions */
  --riff-titlebar-h: 56px;
  --riff-sidebar-w: 280px;
  --riff-playerbar-h: 88px;
}

@layer base {
  html {
    font-family: var(--riff-font-sans);
    background: var(--riff-background);
    color: var(--riff-foreground);
  }
  body {
    background: var(--riff-background);
    color: var(--riff-foreground);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
}

    </style>

    th { @apply whitespace-nowrap; }
  }
