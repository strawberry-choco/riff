# Integration-test crate for the riff workspace (split layout).
#
# NOTE: this crate deliberately does NOT inherit `[lints] workspace = true`,
# even though every other member does. Do not "fix" the apparent omission.
# The workspace sets clippy's pedantic group, which targets library code;
# this crate is fixtures, mocks and helpers, where pedantic fires on
# intended shapes (multi-arming loops, 200-line test bodies, short local
# bindings). Turning inheritance on here produces 198 clippy errors, all in
# test scaffolding that is not shipped. `cargo clippy --all-targets` still
# covers this crate through the six library crates it builds.
#
# Single integration-test crate rooted at tests/mod.rs (autotests = false,
# one [[test]] target), organized into domain/app/infra/ui/golden/integration
# suites with shared test_utils/mocks/integration_helpers.
#
# Depends on every workspace crate by name (per-crate imports) so each
# suite reaches the type it needs directly.
#
# Run (the package is `riff-tests`, not the directory name `tests`):
#   cargo test -p riff-tests
#   cargo test -p riff-tests domain_tests
#
# See docs/engineering/testing-strategy.md and
# docs/engineering/golden-image-testing.md.

[package]
name = "riff-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Private integration-test crate for the riff workspace; not published."
publish = false

autotests = false


[[test]]
name = "integration"
path = "mod.rs"

[dependencies]
riff-backend = { path = "../crates/riff-backend" }
riff-infra = { path = "../crates/riff-infra" }
riff-library = { path = "../crates/riff-library" }
riff-playback = { path = "../crates/riff-playback" }
riff-persistence = { path = "../crates/riff-persistence" }
riff-gui     = { path = "../crates/riff-gui" }

# Golden-image tests render real egui frames headlessly (kittest + wgpu).
egui = "0.36"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
# The whole-frame tests drive the real app through its `eframe::App` impl, so
# this crate names `eframe::CreationContext` directly (the kittest `eframe`
# feature pulls the crate in, but a direct dependency is what lets us name it).
eframe = "0.36"

# Test helpers used at test-runtime by app suites.
tempfile = "3.8"
crossbeam-channel = "0.5"
# Counting pixels in headlessly rendered golden snapshots.
image = { version = "0.25", default-features = false, features = ["png"] }

